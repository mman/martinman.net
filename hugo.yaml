baseURL: https://martinman.net/
locale: en-US
title: martinman.net
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # required by PaperMod search

params:
  env: production
  description: "HomeKit, Victron Energy, Node-RED and modifying a Niesmann+Bischoff iSmove 6.9E motorhome"
  author: Martin Man
  keywords: [HomeKit, Victron, Node-RED, iSmove, motorhome, camper, electronics]
  DateFormat: "2 January 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  UseHugoToc: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  comments: false

  homeInfoParams:
    Title: "Hi, I'm Martin 👋"
    Content: >
      Notes on HomeKit, Victron Energy, Node-RED and modifying our
      Niesmann+Bischoff iSmove 6.9E motorhome: adding components, building new
      electronics, and wiring it all together.

  socialIcons:
    - name: github
      title: GitHub
      url: https://github.com/mman
    - name: rss
      title: RSS feed
      url: /index.xml

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: [title, permalink, summary, content]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: series
      name: Series
      url: /series/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
    - identifier: about
      name: About
      url: /about/
      weight: 60

taxonomies:
  tag: tags
  category: categories
  series: series

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true # allow raw HTML in markdown (embeds, diagrams)

pygmentsUseClasses: true
